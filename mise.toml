[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
actionlint = "1.7.12"
bun = "1.4.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-packager" = "0.11.8"
lefthook = "2.1.12"
markdownlint-cli2 = "0.23.2"
pinact = "4.1.1"
rust = { version = "1.98.1", components = ["clippy", "rustfmt"], profile = "minimal" }
zig = "0.15.2"
zizmor = "1.30.0"

[tasks.setup]
description = "Install project tools and local Git hooks"
run = ["mise install", "mise run scripts:install", "mise run doctor", "lefthook install"]

[tasks.doctor]
description = "Check platform development prerequisites"
run = '''
if [ "$(uname -s)" = Darwin ]; then
  if ! xcodebuild -version >/dev/null 2>&1; then
    echo "Xcode is not installed or selected for Huterm's macOS build" >&2
    echo "install Xcode and select it with xcode-select" >&2
    echo "see docs/agents/development.md for macOS setup" >&2
    exit 1
  fi
  if ! xcrun --find metal >/dev/null 2>&1; then
    echo "missing Xcode Metal Toolchain required for GPUI shaders" >&2
    echo "install it with: xcodebuild -downloadComponent MetalToolchain" >&2
    echo "see docs/agents/development.md for macOS setup" >&2
    exit 1
  fi
elif [ "$(uname -s)" = Linux ]; then
  missing=""
  for library in xkbcommon xkbcommon-x11; do
    if ! pkg-config --exists "$library"; then
      missing="$missing $library"
    fi
  done
  if [ -n "$missing" ]; then
    echo "missing Linux GPUI libraries:$missing" >&2
    echo "see docs/agents/development.md for package installation" >&2
    exit 1
  fi
fi
'''

[tasks.dev]
description = "Run the native Huterm app"
depends = ["ghostty:prepare"]
run = "bash scripts/build-exec.sh cargo run --locked -p huterm"

[tasks.build]
description = "Build the workspace"
depends = ["ghostty:prepare"]
run = "bash scripts/build-exec.sh cargo build --workspace --locked"

[tasks.format]
description = "Format Rust and repository configuration"
run = ["cargo fmt --all", "pinact run"]

[tasks."actions:update"]
description = "Update GitHub Actions pins after the three-day cooldown"
run = "pinact run --update"

[tasks."tools:update"]
description = "Update project Mise tools after the three-day cooldown"
run = "mise up --bump --local --minimum-release-age 3d"

[tasks."format:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
depends = ["ghostty:prepare"]
description = "Run Clippy with warnings denied"
run = "bash scripts/build-exec.sh cargo clippy --workspace --all-targets --features huterm-config/schema --locked -- -D warnings"

[tasks."lint:docs"]
description = "Lint Markdown documentation"
run = "markdownlint-cli2 'README.md' 'AGENTS.md' 'docs/**/*.md'"

[tasks."lint:docs:files"]
description = "Lint selected Markdown files"
run = "markdownlint-cli2 --no-globs --"

[tasks.typecheck]
depends = ["ghostty:prepare"]
description = "Type-check all workspace targets"
run = "bash scripts/build-exec.sh cargo check --workspace --all-targets --locked"

[tasks.architecture]
description = "Check dependency-neutral protocol boundary"
run = '''
dependencies="$(cargo tree --locked -p huterm-protocol --depth 1 --edges normal,build --prefix none | tail -n +2)"
if [ -n "$dependencies" ]; then
  echo "huterm-protocol must not have normal or build dependencies:" >&2
  echo "$dependencies" >&2
  exit 1
fi
config_dependencies="$(cargo tree --locked -p huterm-config --features schema --prefix none --edges normal,build)"
if echo "$config_dependencies" | rg '^(gpui|huterm-core|alacritty_terminal|libghostty-vt|portable-pty)( |-)'; then
  echo "huterm-config must remain independent of desktop and terminal engines" >&2
  exit 1
fi
'''

[tasks.check]
description = "Run fast deterministic local checks"
depends = ["format:check", "lint", "lint:docs", "architecture", "check:scripts", "schema:check"]

[tasks."check:rust"]
description = "Run Rust formatting, Clippy compilation, and architecture checks"
depends = ["format:check", "lint", "architecture"]

[tasks."check:rust:analysis"]
hide = true
depends = ["lint", "architecture"]

[tasks.test]
description = "Run workspace and scripting tests"
depends = ["test:scripts", "test:rust"]

[tasks."test:rust"]
description = "Run Rust unit and PTY integration tests"
depends = ["ghostty:prepare"]
run = "bash scripts/build-exec.sh cargo test --workspace --all-targets --locked"

[tasks."test:scroll-checker"]
description = "Test scroll benchmark log validation"
run = "bun test ./scripts/check-scroll-benchmark.test.ts"

[tasks."smoke:linux"]
depends = ["ghostty:prepare"]
description = "Launch the Linux GPUI client under Xvfb"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "Linux smoke skipped on $(uname -s)"
  exit 0
fi
bash scripts/build-exec.sh cargo build --workspace --locked
smoke_config=$(mktemp)
trap 'rm -f "$smoke_config"' EXIT
printf '[terminal]\nclose_on_exit = false\n' > "$smoke_config"
set +e
HUTERM_CONFIG_FILE="$smoke_config" SHELL=/bin/true timeout --signal=TERM 8s xvfb-run -a \
  -s '-screen 0 1280x800x24 -noreset' target/debug/huterm
status=$?
set -e
if [ "$status" -ne 124 ]; then
  echo "Huterm exited before the 8-second smoke window (status $status)" >&2
  exit 1
fi
'''

[tasks."bench:renderer"]
depends = ["ghostty:prepare"]
description = "Measure release-mode GPUI renderer CPU work under Xvfb"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "Renderer benchmark currently requires Linux and Xvfb" >&2
  exit 1
fi
if ! command -v twm >/dev/null 2>&1; then
  echo "Renderer benchmark requires twm so Xvfb exposes the GPUI window" >&2
  exit 1
fi
bash scripts/build-exec.sh cargo build --release --locked -p huterm
bench_config="$(mktemp)"
trap 'rm -f "$bench_config"' EXIT
printf '[terminal]\nengine = "%s"\n' "${HUTERM_BENCH_ENGINE:-alacritty}" > "$bench_config"
export HUTERM_CONFIG_FILE="$bench_config"
bash scripts/build-exec.sh cargo build --release --locked -p huterm-gpui --example render_workload
workload="$(pwd)/target/release/examples/render_workload"
set +e
xvfb-run -a -s '-screen 0 1280x800x24 -noreset' sh -c '
  LC_ALL=C twm -f scripts/linux/benchmark.twmrc &
  wm_pid=$!
  SHELL="$1" HUTERM_RENDER_STATS=1 HUTERM_RENDER_BENCH=1 \
    timeout --signal=TERM 8s "$2"
  result=$?
  kill "$wm_pid" >/dev/null 2>&1 || true
  wait "$wm_pid" >/dev/null 2>&1 || true
  exit "$result"
' sh "$workload" target/release/huterm
status=$?
set -e
if [ "$status" -ne 124 ]; then
  echo "Huterm renderer benchmark ended early (status $status)" >&2
  exit 1
fi
'''

[tasks."bench:scroll"]
depends = ["ghostty:prepare"]
description = "Measure release-mode scroll coordination and rendering"
run = '''
platform="$(uname -s)"
if [ "$platform" != Linux ] && [ "$platform" != Darwin ]; then
  echo "Scroll benchmark requires Linux or macOS" >&2
  exit 1
fi
if [ "$platform" = Linux ] && ! command -v twm >/dev/null 2>&1; then
  echo "Scroll benchmark requires twm so Xvfb exposes the GPUI window" >&2
  exit 1
fi
bash scripts/build-exec.sh cargo build --release --locked -p huterm
bench_config="$(mktemp)"
printf '[terminal]\nengine = "%s"\n' "${HUTERM_BENCH_ENGINE:-alacritty}" > "$bench_config"
export HUTERM_CONFIG_FILE="$bench_config"
bash scripts/build-exec.sh cargo build --release --locked -p huterm-gpui --example scroll_workload
workload="$(pwd)/target/release/examples/scroll_workload"
report="$(mktemp)"
revision="${HUTERM_SOURCE_REVISION:-$(git rev-parse HEAD)}"
if [ "$platform" = Darwin ]; then
  hardware="$(sysctl -n hw.model)"
else
  hardware="$(lscpu | awk -F: '$1 == "Model name" { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
fi
app_pid=""
cleanup() {
  if [ -n "$app_pid" ]; then
    kill "$app_pid" >/dev/null 2>&1 || true
  fi
  rm -f "$report" "$bench_config"
}
trap cleanup EXIT
if [ "$platform" = Linux ]; then
  set +e
  xvfb-run -a -s '-screen 0 1280x800x24 -noreset' sh -c '
    LC_ALL=C twm -f scripts/linux/benchmark.twmrc &
    wm_pid=$!
    SHELL="$1" HUTERM_SCROLL_BENCH=1 HUTERM_SCROLL_REVISION="$4" \
      HUTERM_SCROLL_HARDWARE="$5" \
      timeout --signal=TERM 10s "$2" >"$3" 2>&1
    result=$?
    cat "$3"
    kill "$wm_pid" >/dev/null 2>&1 || true
    wait "$wm_pid" >/dev/null 2>&1 || true
    exit "$result"
  ' sh "$workload" target/release/huterm "$report" "$revision" "$hardware"
  status=$?
  set -e
  if [ "$status" -ne 124 ]; then
    echo "Huterm scroll benchmark ended early (status $status)" >&2
    exit 1
  fi
else
  SHELL="$workload" HUTERM_SCROLL_BENCH=1 \
    HUTERM_SCROLL_REVISION="$revision" \
    HUTERM_SCROLL_HARDWARE="$hardware" \
    target/release/huterm >"$report" 2>&1 &
  app_pid=$!
  sleep 10
  if ! kill -0 "$app_pid" >/dev/null 2>&1; then
    set +e
    wait "$app_pid"
    status=$?
    set -e
    app_pid=""
    cat "$report"
    echo "Huterm scroll benchmark ended early (status $status)" >&2
    exit 1
  fi
  kill -TERM "$app_pid" >/dev/null 2>&1 || true
  set +e
  wait "$app_pid"
  set -e
  app_pid=""
  cat "$report"
fi
bun scripts/check-scroll-benchmark.ts "$report"
'''

[tasks."package:macos"]
description = "Build and verify the universal macOS Huterm.app bundle"
run = '''
set -eu
if [ "$(uname -s)" != Darwin ]; then
  echo "macOS packaging requires a macOS host" >&2
  exit 1
fi
cargo packager --release --formats app
bundle="target/release/bundle/Huterm.app"
plist="$bundle/Contents/Info.plist"
executable="$bundle/Contents/MacOS/huterm"
metadata="$(cargo metadata --no-deps --format-version 1)"
identifier="$(printf '%s' "$metadata" | bun scripts/package-metadata.ts identifier)"
version="$(printf '%s' "$metadata" | bun scripts/package-metadata.ts version)"
assert_equal() {
  if [ "$1" != "$2" ]; then
    echo "package verification failed for $3: expected '$2', got '$1'" >&2
    exit 1
  fi
}
assert_file() {
  if [ ! -f "$1" ]; then
    echo "package verification failed: missing $2 at $1" >&2
    exit 1
  fi
}
assert_equal "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" "$identifier" "CFBundleIdentifier"
assert_equal "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" "$version" "CFBundleShortVersionString"
assert_equal "$(/usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$plist")" "public.app-category.developer-tools" "LSApplicationCategoryType"
icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")"
packaged_icon="$bundle/Contents/Resources/$icon"
assert_file "$packaged_icon" "bundle icon"
for notice in catppuccin folke dracula nordtheme binaryify chriskempson; do
  assert_file "$bundle/Contents/Resources/themes/licenses/$notice.txt" "theme license"
done
if ! cmp -s assets/Huterm.icns "$packaged_icon"; then
  echo "package verification failed: $packaged_icon differs from assets/Huterm.icns" >&2
  exit 1
fi
assert_file "$bundle/Contents/Resources/ghostty/ghostty-MIT.txt" "Ghostty license"
assert_file "$bundle/Contents/Resources/terminal-graphics/LICENSE-Ghostty" "terminal graphics license"
if otool -L "$executable" | rg -q 'libghostty'; then
  echo "package verification failed: Ghostty must be statically linked" >&2
  exit 1
fi
if [ ! -x "$executable" ]; then
  echo "package verification failed: executable is missing or not executable at $executable" >&2
  exit 1
fi
lipo "$executable" -verify_arch arm64
lipo "$executable" -verify_arch x86_64
bun scripts/release-macos.ts verify-package-config "$bundle"
echo "verified $bundle ($identifier, version $version, arm64 + x86_64)"
'''

[tasks.license]
description = "Audit dependency advisories, licenses, bans, and sources"
run = "cargo deny --locked check"

[tasks."ci:workflows"]
description = "Validate and secure GitHub Actions workflows"
run = ["actionlint", "zizmor --offline .", "pinact run --check --verify-comment"]

[tasks."verify:toolchain"]
description = "Materialize the pinned Rust toolchain before parallel checks"
run = ["cargo --version", "rustfmt --version", "cargo clippy --version"]

[tasks."verify:parallel"]
hide = true
depends = ["check", "test", "license", "audit:scripts", "ci:workflows", "vendor:check"]

[tasks."verify:platform:parallel"]
hide = true
depends = ["check:rust", "check:scripts", "test"]

[tasks."verify:platform"]
description = "Run platform-specific Rust validation"
depends = ["verify:toolchain"]
run = "mise run verify:platform:parallel"

[tasks."verify:policy"]
description = "Run platform-independent repository policy checks"
depends = ["lint:docs", "ci:workflows"]

[tasks.verify]
description = "Run the broad CI-equivalent validation"
depends = ["verify:toolchain"]
run = "mise run verify:parallel"

[tasks."smoke:macos-quit"]
depends = ["ghostty:prepare"]
description = "Verify cancellable AppKit termination with a real PTY"
run = [
  "bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example native_quit_smoke",
  "bun scripts/check-native-quit.ts target/debug/examples/native_quit_smoke",
  "bun scripts/check-native-quit.ts target/debug/examples/native_quit_smoke ghostty",
]

[tasks."bench:engine"]
depends = ["ghostty:prepare"]
description = "Measure release engine processing and snapshot elapsed times"
run = "bash scripts/build-exec.sh cargo test --release --locked -p huterm-core engine_benchmark -- --ignored --nocapture --test-threads=1"

[tasks."ghostty:prepare"]
description = "Verify pinned source and Zig for the Ghostty engine"
run = "bash scripts/build-exec.sh bun scripts/prepare-ghostty.ts"

[tasks."ghostty:check"]
description = "Verify prepared Ghostty sources against the reviewed tree hash"
run = "bun scripts/prepare-ghostty.ts --check"

[tasks."bench:engine:ghostty"]
description = "Measure the release Ghostty engine with matching fixtures"
run = "HUTERM_BENCH_ENGINE=ghostty mise run bench:engine"

[tasks."bench:scroll:ghostty"]
description = "Run existing scroll correctness and queue budgets with Ghostty"
run = "HUTERM_BENCH_ENGINE=ghostty mise run bench:scroll"

[tasks."bench:renderer:ghostty"]
description = "Measure the existing GPUI renderer using Ghostty snapshots"
run = "HUTERM_BENCH_ENGINE=ghostty mise run bench:renderer"

[tasks."package:build:macos"]
hide = true
depends = ["ghostty:prepare", "package:targets:macos"]
run = '''
set -eu
bash scripts/build-exec.sh cargo build --release --locked --target aarch64-apple-darwin -p huterm
bash scripts/build-exec.sh cargo build --release --locked --target x86_64-apple-darwin -p huterm
mkdir -p target/universal-apple-darwin/release
lipo -create target/aarch64-apple-darwin/release/huterm target/x86_64-apple-darwin/release/huterm -output target/universal-apple-darwin/release/huterm
lipo target/universal-apple-darwin/release/huterm -verify_arch arm64
lipo target/universal-apple-darwin/release/huterm -verify_arch x86_64
'''

[tasks."package:targets:macos"]
description = "Install both Rust targets for universal macOS packaging"
run = "rustup target add aarch64-apple-darwin x86_64-apple-darwin"

[tasks."release:macos"]
description = "Build, sign, notarize, and package the universal macOS release"
run = "bun scripts/release-macos.ts build"

[tasks."build:exec"]
description = "Run a command with a compatible macOS SDK"
run = "bash scripts/build-exec.sh"

[tasks."test:build-toolchain"]
description = "Test Ghostty SDK selection"
run = "bun test ./scripts/build-exec.test.ts"

[tasks."scripts:install"]
description = "Install locked TypeScript tooling dependencies"
run = "bun install --frozen-lockfile"

[tasks."typecheck:scripts"]
description = "Type-check repository scripts with TypeScript 7"
depends = ["scripts:install"]
run = "bun node_modules/typescript/bin/tsc --noEmit"

[tasks."test:scripts"]
description = "Test repository tooling with Bun"
depends = ["scripts:install"]
run = "bun test scripts"

[tasks."check:shell"]
description = "Check shell script syntax"
run = "bash -n scripts/build-exec.sh && bash -n scripts/zig-sdk-bin/xcrun && bash -n scripts/linux/entrypoint.sh"

[tasks."check:scripts"]
description = "Check TypeScript tooling and shell scripts"
depends = ["typecheck:scripts", "test:scripts", "check:shell"]

[tasks."audit:scripts"]
description = "Audit locked scripting dependencies"
depends = ["scripts:install"]
run = "bun audit"

[tasks."smoke:macos-menus"]
depends = ["ghostty:prepare"]
description = "Verify native AppKit menu shortcuts at startup and reload"
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo "Native menu smoke skipped: AppKit requires macOS"
  exit 0
fi
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example native_menus_smoke
bun scripts/check-native-menus.ts target/debug/examples/native_menus_smoke
'''

[tasks."smoke:linux-input"]
depends = ["ghostty:prepare"]
description = "Verify X11 Alt input and shortcut dispatch through both PTY engines"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "Linux input smoke skipped: X11 requires Linux"
  exit 0
fi
bash scripts/build-exec.sh cargo build --workspace --locked
xvfb-run -a -s '-screen 0 1280x800x24 -noreset' bun scripts/check-linux-input.ts target/debug/huterm
'''

[tasks."smoke:linux-fullscreen"]
depends = ["ghostty:prepare"]
description = "Verify X11 fullscreen, ignored EWMH requests, and PTY restoration"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "Linux fullscreen smoke skipped: X11 requires Linux"
  exit 0
fi
for tool in openbox xprop xdotool setxkbmap; do
  command -v "$tool" >/dev/null || { echo "Fullscreen smoke requires $tool" >&2; exit 1; }
done
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example fullscreen_smoke
xvfb-run -a -s '-screen 0 1280x800x24 -noreset' bun scripts/check-fullscreen.ts target/debug/examples/fullscreen_smoke
'''

[tasks."smoke:macos-fullscreen"]
depends = ["ghostty:prepare"]
description = "Verify AppKit fullscreen modes, presentation leases, and PTY restoration"
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo "Native fullscreen smoke skipped: AppKit requires macOS"
  exit 0
fi
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example fullscreen_smoke
bun scripts/check-fullscreen.ts target/debug/examples/fullscreen_smoke
'''

[tasks."smoke:macos-input"]
depends = ["ghostty:prepare"]
description = "Verify native AppKit input and composition through both PTY engines"
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo "Native input smoke skipped: AppKit requires macOS"
  exit 0
fi
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example native_input_smoke
bun scripts/check-native-input.ts target/debug/examples/native_input_smoke
'''

[tasks."ci:lint"]
description = "Run CI Clippy and architecture checks"
depends = ["verify:toolchain"]
run = "mise run check:rust:analysis"

[tasks."ci:test"]
description = "Run CI Rust unit and PTY integration tests"
depends = ["verify:toolchain"]
run = "mise run test:rust"

[tasks."ci:smoke"]
description = "Run CI desktop smokes for the current platform"
depends = ["verify:toolchain"]
run = '''
case "$(uname -s)" in
  Darwin)
    mise run smoke:renderer
    mise run smoke:macos-menus
    mise run smoke:macos-input
    mise run smoke:macos-integration
    mise run smoke:macos-quit
    mise run smoke:macos-fullscreen
    ;;
  Linux)
    mise run smoke:renderer
    mise run smoke:linux
    mise run smoke:linux-input
    mise run smoke:linux-integration
    mise run smoke:linux-fullscreen
    ;;
  *) echo "Desktop smokes require Linux or macOS" >&2; exit 1 ;;
esac
'''

[tasks."ci:benchmarks"]
description = "Run CI scroll and link lookup budgets for both engines"
depends = ["verify:toolchain"]
run = ["mise run bench:scroll", "mise run bench:scroll:ghostty", "mise run bench:links"]

[tasks."smoke:renderer"]
description = "Verify built-in terminal graphics through native GPUI preparation and paint"
depends = ["ghostty:prepare"]
run = '''
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example renderer_smoke
if [ "$(uname -s)" = Linux ]; then
  xvfb-run -a -s '-screen 0 1280x960x24 -noreset' bun scripts/check-renderer.ts target/debug/examples/renderer_smoke
else
  bun scripts/check-renderer.ts target/debug/examples/renderer_smoke
fi
'''

[tasks."linux:test"]
description = "Run Rust tests in Docker (native architecture by default)"
run = "bun scripts/linux.ts test"

[tasks."linux:smoke"]
description = "Run Linux desktop smokes in Docker"
run = "bun scripts/linux.ts smoke"

[tasks."linux:exec"]
description = "Run a command in the Linux test container"
run = "bun scripts/linux.ts exec"

[tasks."linux:clean"]
description = "Remove this worktree's Linux cache volumes for the selected architecture"
run = "bun scripts/linux.ts clean"

[tasks."bench:links"]
depends = ["ghostty:prepare"]
description = "Measure bounded owner-thread URL and OSC8 lookup for both engines"
run = "bash scripts/build-exec.sh cargo test --release --locked -p huterm-core bounded_link_lookup_elapsed_time -- --ignored --nocapture"

[tasks."smoke:macos-integration"]
depends = ["ghostty:prepare"]
description = "Verify AppKit terminal links and native file-drop paste for both engines"
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo "AppKit integration smoke requires macOS" >&2
  exit 1
fi
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example integration_smoke
bun scripts/check-desktop-integration.ts target/debug/examples/integration_smoke
'''

[tasks."smoke:linux-integration"]
depends = ["ghostty:prepare"]
description = "Verify X11 links and native XDND file-drop paste for both engines"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "X11 integration smoke requires Linux" >&2
  exit 1
fi
bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example integration_smoke --example xdnd_source
xvfb-run -a -s '-screen 0 1280x800x24 -noreset' bun scripts/check-desktop-integration.ts target/debug/examples/integration_smoke
'''

[tasks."smoke:manual-integration"]
description = "Launch a safe raw-PTY recorder for Finder or file-manager QA (engine argument)"
depends = ["ghostty:prepare"]
run = "bash scripts/build-exec.sh cargo build --locked -p huterm-gpui --example integration_smoke && bun scripts/manual-desktop-integration.ts"

[tasks."vendor:check"]
description = "Verify vendored crates match their pinned archives and patches"
run = "bun scripts/vendor.ts check"

[tasks."vendor:start"]
description = "Start a targeted vendor edit session: <crate> <patch>"
run = "bun scripts/vendor.ts start"

[tasks."vendor:finish"]
description = "Fold tested vendor edits into the selected patch and replay later patches: <crate>"
run = "bun scripts/vendor.ts finish"

[tasks."vendor:continue"]
description = "Resume a vendor session after resolving a replay conflict: <crate>"
run = "bun scripts/vendor.ts continue"

[tasks."vendor:status"]
description = "Show active vendor edit sessions, optionally for one crate"
run = "bun scripts/vendor.ts status"

[tasks."vendor:cancel"]
description = "Cancel a vendor session, retaining source edits and recovery state: <crate>"
run = "bun scripts/vendor.ts cancel"

[tasks."vendor:reopen"]
description = "Return a vendor session to editing, preserving source and replay work: <crate>"
run = "bun scripts/vendor.ts reopen"

[tasks."schema:generate"]
description = "Generate committed config and theme schemas without native dependencies"
run = "cargo run --locked -p huterm-config --features schema --bin huterm-schema -- --write"

[tasks."schema:check"]
description = "Check committed config and theme schema bytes without rewriting files"
run = "cargo run --locked -p huterm-config --features schema --bin huterm-schema -- --check"

[tasks."smoke:schema-editor"]
