[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
actionlint = "1.7.12"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-packager" = "0.11.8"
lefthook = "2.1.12"
markdownlint-cli2 = "0.23.2"
pinact = "4.1.1"
rust = { version = "1.98.0", components = ["clippy", "rustfmt"], profile = "minimal" }
zizmor = "1.30.0"

[tasks.setup]
description = "Install project tools and local Git hooks"
run = ["mise install", "mise run doctor", "lefthook install"]

[tasks.doctor]
description = "Check platform development prerequisites"
run = '''
if [ "$(uname -s)" = Darwin ]; then
  if ! xcodebuild -version >/dev/null 2>&1; then
    echo "Xcode is not installed or selected for Huterm's macOS build" >&2
    echo "install Xcode and select it with xcode-select" >&2
    echo "see docs/agents/development.md for macOS setup" >&2
    exit 1
  fi
  if ! xcrun --find metal >/dev/null 2>&1; then
    echo "missing Xcode Metal Toolchain required for GPUI shaders" >&2
    echo "install it with: xcodebuild -downloadComponent MetalToolchain" >&2
    echo "see docs/agents/development.md for macOS setup" >&2
    exit 1
  fi
elif [ "$(uname -s)" = Linux ]; then
  missing=""
  for library in xkbcommon xkbcommon-x11; do
    if ! pkg-config --exists "$library"; then
      missing="$missing $library"
    fi
  done
  if [ -n "$missing" ]; then
    echo "missing Linux GPUI libraries:$missing" >&2
    echo "see docs/agents/development.md for package installation" >&2
    exit 1
  fi
fi
'''

[tasks.dev]
description = "Run the native Huterm app"
run = "cargo run --locked -p huterm"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace --locked"

[tasks.format]
description = "Format Rust and repository configuration"
run = ["cargo fmt --all", "pinact run"]

[tasks."actions:update"]
description = "Update GitHub Actions pins after the three-day cooldown"
run = "pinact run --update"

[tasks."tools:update"]
description = "Update project Mise tools after the three-day cooldown"
run = "mise up --bump --local --minimum-release-age 3d"

[tasks."format:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."lint:docs"]
description = "Lint Markdown documentation"
run = "markdownlint-cli2 'README.md' 'AGENTS.md' 'docs/**/*.md'"

[tasks."lint:docs:files"]
description = "Lint selected Markdown files"
run = "markdownlint-cli2 --no-globs --"

[tasks.typecheck]
description = "Type-check all workspace targets"
run = "cargo check --workspace --all-targets --all-features --locked"

[tasks.architecture]
description = "Check dependency-neutral protocol boundary"
run = '''
dependencies="$(cargo tree --locked -p huterm-protocol --depth 1 --edges normal,build --prefix none | tail -n +2)"
if [ -n "$dependencies" ]; then
  echo "huterm-protocol must not have normal or build dependencies:" >&2
  echo "$dependencies" >&2
  exit 1
fi
'''

[tasks.check]
description = "Run fast deterministic local checks"
depends = ["format:check", "lint", "lint:docs", "architecture"]

[tasks."check:rust"]
description = "Run Rust formatting, Clippy compilation, and architecture checks"
depends = ["format:check", "lint", "architecture"]

[tasks."check:rust:analysis"]
hide = true
depends = ["lint", "architecture"]

[tasks.test]
description = "Run workspace tests"
depends = ["test:scroll-checker"]
run = "cargo test --workspace --all-targets --all-features --locked"

[tasks."test:scroll-checker"]
description = "Test scroll benchmark log validation"
run = "python3 scripts/test-scroll-benchmark-checker.py"

[tasks."smoke:linux"]
description = "Launch the Linux GPUI client under Xvfb"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "Linux smoke skipped on $(uname -s)"
  exit 0
fi
cargo build --workspace --locked
set +e
SHELL=/bin/true timeout --signal=TERM 8s xvfb-run -a \
  -s '-screen 0 1280x800x24' target/debug/huterm
status=$?
set -e
if [ "$status" -ne 124 ]; then
  echo "Huterm exited before the 8-second smoke window (status $status)" >&2
  exit 1
fi
'''

[tasks."bench:renderer"]
description = "Measure release-mode GPUI renderer CPU work under Xvfb"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "Renderer benchmark currently requires Linux and Xvfb" >&2
  exit 1
fi
if ! command -v twm >/dev/null 2>&1; then
  echo "Renderer benchmark requires twm so Xvfb exposes the GPUI window" >&2
  exit 1
fi
cargo build --release --locked -p huterm
cargo build --release --locked -p huterm-gpui --example render_workload
workload="$(pwd)/target/release/examples/render_workload"
set +e
xvfb-run -a -s '-screen 0 1280x800x24' sh -c '
  twm >/dev/null 2>&1 &
  wm_pid=$!
  SHELL="$1" HUTERM_RENDER_STATS=1 HUTERM_RENDER_BENCH=1 \
    timeout --signal=TERM 8s "$2"
  result=$?
  kill "$wm_pid" >/dev/null 2>&1 || true
  wait "$wm_pid" >/dev/null 2>&1 || true
  exit "$result"
' sh "$workload" target/release/huterm
status=$?
set -e
if [ "$status" -ne 124 ]; then
  echo "Huterm renderer benchmark ended early (status $status)" >&2
  exit 1
fi
'''

[tasks."bench:scroll"]
description = "Measure release-mode scroll coordination and rendering"
run = '''
platform="$(uname -s)"
if [ "$platform" != Linux ] && [ "$platform" != Darwin ]; then
  echo "Scroll benchmark requires Linux or macOS" >&2
  exit 1
fi
if [ "$platform" = Linux ] && ! command -v twm >/dev/null 2>&1; then
  echo "Scroll benchmark requires twm so Xvfb exposes the GPUI window" >&2
  exit 1
fi
cargo build --release --locked -p huterm
cargo build --release --locked -p huterm-gpui --example scroll_workload
workload="$(pwd)/target/release/examples/scroll_workload"
report="$(mktemp)"
revision="$(git rev-parse HEAD)"
if [ "$platform" = Darwin ]; then
  hardware="$(sysctl -n hw.model)"
else
  hardware="$(lscpu | awk -F: '$1 == "Model name" { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
fi
app_pid=""
cleanup() {
  if [ -n "$app_pid" ]; then
    kill "$app_pid" >/dev/null 2>&1 || true
  fi
  rm -f "$report"
}
trap cleanup EXIT
if [ "$platform" = Linux ]; then
  set +e
  xvfb-run -a -s '-screen 0 1280x800x24' sh -c '
    twm >/dev/null 2>&1 &
    wm_pid=$!
    SHELL="$1" HUTERM_SCROLL_BENCH=1 HUTERM_SCROLL_REVISION="$4" \
      HUTERM_SCROLL_HARDWARE="$5" \
      timeout --signal=TERM 10s "$2" >"$3" 2>&1
    result=$?
    cat "$3"
    kill "$wm_pid" >/dev/null 2>&1 || true
    wait "$wm_pid" >/dev/null 2>&1 || true
    exit "$result"
  ' sh "$workload" target/release/huterm "$report" "$revision" "$hardware"
  status=$?
  set -e
  if [ "$status" -ne 124 ]; then
    echo "Huterm scroll benchmark ended early (status $status)" >&2
    exit 1
  fi
else
  SHELL="$workload" HUTERM_SCROLL_BENCH=1 \
    HUTERM_SCROLL_REVISION="$revision" \
    HUTERM_SCROLL_HARDWARE="$hardware" \
    target/release/huterm >"$report" 2>&1 &
  app_pid=$!
  sleep 10
  if ! kill -0 "$app_pid" >/dev/null 2>&1; then
    set +e
    wait "$app_pid"
    status=$?
    set -e
    app_pid=""
    cat "$report"
    echo "Huterm scroll benchmark ended early (status $status)" >&2
    exit 1
  fi
  kill -TERM "$app_pid" >/dev/null 2>&1 || true
  set +e
  wait "$app_pid"
  set -e
  app_pid=""
  cat "$report"
fi
python3 scripts/check-scroll-benchmark.py "$report"
'''

[tasks."package:macos"]
description = "Build and verify the Apple Silicon Huterm.app bundle"
run = '''
if [ "$(uname -s)" != Darwin ]; then
  echo "macOS packaging requires an Apple Silicon macOS host" >&2
  exit 1
fi
if [ "$(uname -m)" != arm64 ]; then
  echo "Huterm.app packaging currently supports Apple Silicon only" >&2
  exit 1
fi
cargo packager --release --formats app
bundle="target/release/bundle/Huterm.app"
plist="$bundle/Contents/Info.plist"
executable="$bundle/Contents/MacOS/huterm"
metadata="$(cargo metadata --no-deps --format-version 1)"
identifier="$(printf '%s' "$metadata" | python3 -c 'import json,sys; package=next(item for item in json.load(sys.stdin)["packages"] if item["name"] == "huterm"); print(package["metadata"]["packager"]["identifier"])')"
version="$(printf '%s' "$metadata" | python3 -c 'import json,sys; package=next(item for item in json.load(sys.stdin)["packages"] if item["name"] == "huterm"); print(package["version"])')"
assert_equal() {
  if [ "$1" != "$2" ]; then
    echo "package verification failed for $3: expected '$2', got '$1'" >&2
    exit 1
  fi
}
assert_file() {
  if [ ! -f "$1" ]; then
    echo "package verification failed: missing $2 at $1" >&2
    exit 1
  fi
}
assert_equal "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" "$identifier" "CFBundleIdentifier"
assert_equal "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" "$version" "CFBundleShortVersionString"
assert_equal "$(/usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$plist")" "public.app-category.developer-tools" "LSApplicationCategoryType"
icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")"
packaged_icon="$bundle/Contents/Resources/$icon"
assert_file "$packaged_icon" "bundle icon"
for notice in catppuccin folke dracula nordtheme binaryify chriskempson; do
  assert_file "$bundle/Contents/Resources/themes/licenses/$notice.txt" "theme license"
done
if ! cmp -s assets/Huterm.icns "$packaged_icon"; then
  echo "package verification failed: $packaged_icon differs from assets/Huterm.icns" >&2
  exit 1
fi
if [ ! -x "$executable" ]; then
  echo "package verification failed: executable is missing or not executable at $executable" >&2
  exit 1
fi
architecture="$(file "$executable")"
case "$architecture" in
  *arm64*) ;;
  *)
    echo "package verification failed: expected arm64 executable, got: $architecture" >&2
    exit 1
    ;;
esac
echo "verified $bundle ($identifier, version $version, arm64)"
'''

[tasks.license]
description = "Audit dependency advisories, licenses, bans, and sources"
run = "cargo deny --locked check"

[tasks."ci:workflows"]
description = "Validate and secure GitHub Actions workflows"
run = ["actionlint", "zizmor --offline .", "pinact run --check --verify-comment"]

[tasks."verify:toolchain"]
description = "Materialize the pinned Rust toolchain before parallel checks"
run = ["cargo --version", "rustfmt --version", "cargo clippy --version"]

[tasks."verify:parallel"]
hide = true
depends = ["check", "test", "license", "ci:workflows"]

[tasks."verify:platform:parallel"]
hide = true
depends = ["check:rust", "test"]

[tasks."verify:platform"]
description = "Run platform-specific Rust validation"
depends = ["verify:toolchain"]
run = "mise run verify:platform:parallel"

[tasks."verify:policy"]
description = "Run platform-independent repository policy checks"
depends = ["lint:docs", "ci:workflows"]

[tasks.verify]
description = "Run the broad CI-equivalent validation"
depends = ["verify:toolchain"]
run = "mise run verify:parallel"

[tasks."smoke:macos-quit"]
description = "Verify cancellable AppKit termination with a real PTY"
run = [
  "cargo build --locked -p huterm-gpui --example native_quit_smoke",
  "python3 scripts/check-native-quit.py target/debug/examples/native_quit_smoke",
]
