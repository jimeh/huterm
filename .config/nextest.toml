# Rust tests run through scripts/test-rust.ts (`mise run test:rust`), which
# reruns only failures that match a registered known flake. Nextest's own
# retries stay off so no test reruns before its failure is classified.
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s" }

[profile.default.junit]
path = "junit.xml"
store-failure-output = true

[profile.ci]
# A hung test fails after 10 minutes instead of consuming the job's limit.
slow-timeout = { period = "60s", terminate-after = 10 }
