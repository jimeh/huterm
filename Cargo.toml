[workspace]
members = ["crates/huterm-client", "crates/huterm-config", "crates/huterm-core", "crates/huterm-ghostty", "crates/huterm-ghostty/bindgen", "crates/huterm-gpui", "crates/huterm-ipc-sim", "crates/huterm-procinfo", "crates/huterm-protocol", "crates/huterm-server", "crates/huterm-socket", "crates/huterm-state", "crates/huterm-ui", "crates/huterm-wire"]
exclude = ["third-party/vendor/accesskit_macos-0.26.3", "third-party/vendor/global-hotkey-0.9.0", "third-party/vendor/gpui-pre-0.3.11", "third-party/vendor/gpui-pre-linux-0.3.11", "third-party/vendor/gpui-pre-macos-0.3.11", "third-party/vendor/portable-pty-0.9.0"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jimeh/huterm"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "=2.5.0"
async-executor = "=1.14.1"
async-io = "=2.6.0"
blocking = "=1.7.0"
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["font-kit", "x11"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "x11"] }
huterm-client = { path = "crates/huterm-client", version = "=0.35.0" } # x-release-please-version
huterm-config = { path = "crates/huterm-config", version = "=0.35.0" } # x-release-please-version
huterm-core = { path = "crates/huterm-core", version = "=0.35.0" } # x-release-please-version
huterm-ghostty = { path = "crates/huterm-ghostty", version = "=0.35.0" } # x-release-please-version
huterm-gpui = { path = "crates/huterm-gpui", version = "=0.35.0" } # x-release-please-version
huterm-procinfo = { path = "crates/huterm-procinfo", version = "=0.35.0" } # x-release-please-version
huterm-protocol = { path = "crates/huterm-protocol", version = "=0.35.0" } # x-release-please-version
huterm-server = { path = "crates/huterm-server", version = "=0.35.0" } # x-release-please-version
huterm-socket = { path = "crates/huterm-socket", version = "=0.35.0" } # x-release-please-version
huterm-state = { path = "crates/huterm-state", version = "=0.35.0" } # x-release-please-version
huterm-ui = { path = "crates/huterm-ui", version = "=0.35.0" } # x-release-please-version
huterm-wire = { path = "crates/huterm-wire", version = "=0.35.0" } # x-release-please-version
filedescriptor = "=0.8.3"
futures-lite = "=2.6.1"
memchr = "=2.8.3"
portable-pty = "=0.9.0"
nix = { version = "=0.29.0", features = ["fs", "hostname", "poll", "process", "resource", "signal", "socket", "term", "user"] }
nucleo-matcher = "=0.3.1"
proptest = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "=1.2.1"
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "huterm"
description = "A native terminal emulator and multiplexer"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.35.0"

[features]
default = []
macos-updater = ["huterm-gpui/macos-updater"]

[dependencies]
anyhow.workspace = true
huterm-gpui.workspace = true

[package.metadata.packager]
productName = "Huterm"
identifier = "app.huterm.dev"
category = "Developer Tool"
formats = ["app"]
outDir = "target/release/bundle"
binariesDir = "target/universal-apple-darwin/release"
targetTriple = "universal-apple-darwin"
beforePackagingCommand = "mise run package:build:macos"
icons = ["assets/Huterm.icns", "assets/Huterm.png"]
resources = [{ src = "assets/shell-integration", target = "shell-integration" }, { src = "crates/huterm-gpui/themes", target = "themes" }, { src = "third-party/ghostty", target = "ghostty" }, { src = "third-party/terminal-graphics", target = "terminal-graphics" }, { src = "third-party/lucide", target = "lucide" }, { src = "third-party/dejavu", target = "dejavu" }, { src = "third-party/nerd-fonts", target = "nerd-fonts" }, { src = "third-party/nerd-font-constraints", target = "nerd-font-constraints" }, { src = "third-party/licenses/licenses.json", target = "licenses.json" }, { src = "assets/macos/Assets.car", target = "Assets.car" }, { src = "target/terminfo", target = "terminfo" }]

[package.metadata.packager.macos]
entitlements = "assets/macos/Huterm.entitlements"
infoPlistPath = "assets/macos/Info.plist"
minimumSystemVersion = "14.0"

[[package.metadata.packager.binaries]]
path = "huterm"
main = true

[lints]
workspace = true

[patch.crates-io]
accesskit_macos = { path = "third-party/vendor/accesskit_macos-0.26.3" }
global-hotkey = { path = "third-party/vendor/global-hotkey-0.9.0" }
gpui-pre = { path = "third-party/vendor/gpui-pre-0.3.11" }
gpui-pre-apple = { path = "third-party/vendor/gpui-pre-apple-0.3.11" }
gpui-pre-linux = { path = "third-party/vendor/gpui-pre-linux-0.3.11" }
gpui-pre-macos = { path = "third-party/vendor/gpui-pre-macos-0.3.11" }
gpui-pre-wgpu = { path = "third-party/vendor/gpui-pre-wgpu-0.3.11" }
portable-pty = { path = "third-party/vendor/portable-pty-0.9.0" }

# The IPC design simulation runs thousands of simulated milliseconds per
# test; optimizing only this dependency-free crate keeps `cargo test` fast.
[profile.dev.package.huterm-ipc-sim]
opt-level = 2
