[workspace]
members = ["crates/huterm-config", "crates/huterm-core", "crates/huterm-gpui", "crates/huterm-protocol"]
exclude = ["third-party/vendor/global-hotkey-0.8.0", "third-party/vendor/libghostty-vt-sys-0.2.1", "third-party/vendor/gpui-0.2.2"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jimeh/huterm"
rust-version = "1.88"

[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1.0.104"
async-channel = "=2.5.0"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }
huterm-config = { path = "crates/huterm-config", version = "=0.7.1" } # x-release-please-version
huterm-core = { path = "crates/huterm-core", version = "=0.7.1" } # x-release-please-version
huterm-gpui = { path = "crates/huterm-gpui", version = "=0.7.1" } # x-release-please-version
huterm-protocol = { path = "crates/huterm-protocol", version = "=0.7.1" } # x-release-please-version
filedescriptor = "=0.8.3"
portable-pty = "=0.9.0"
nix = { version = "=0.29.0", features = ["fs", "process", "signal"] }
nucleo-matcher = "=0.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "=1.1.5"
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "huterm"
description = "A native terminal emulator and multiplexer"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.7.1"

[features]
default = []
macos-updater = ["huterm-gpui/macos-updater"]

[dependencies]
anyhow.workspace = true
huterm-gpui.workspace = true

[package.metadata.packager]
productName = "Huterm"
identifier = "app.huterm.dev"
category = "Developer Tool"
formats = ["app"]
outDir = "target/release/bundle"
binariesDir = "target/universal-apple-darwin/release"
targetTriple = "universal-apple-darwin"
beforePackagingCommand = "mise run package:build:macos"
icons = ["assets/Huterm.icns", "assets/Huterm.png"]
resources = [{ src = "crates/huterm-gpui/themes", target = "themes" }, { src = "third-party/ghostty", target = "ghostty" }, { src = "third-party/terminal-graphics", target = "terminal-graphics" }, { src = "assets/macos/Assets.car", target = "Assets.car" }]

[package.metadata.packager.macos]
entitlements = "assets/macos/Huterm.entitlements"
infoPlistPath = "assets/macos/Info.plist"
minimumSystemVersion = "10.15.7"

[[package.metadata.packager.binaries]]
path = "huterm"
main = true

[lints]
workspace = true

[patch.crates-io]
global-hotkey = { path = "third-party/vendor/global-hotkey-0.8.0" }
gpui = { path = "third-party/vendor/gpui-0.2.2" }
libghostty-vt-sys = { path = "third-party/vendor/libghostty-vt-sys-0.2.1" }
