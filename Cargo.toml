[workspace]
members = ["crates/huterm-core", "crates/huterm-gpui", "crates/huterm-protocol"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jimeh/huterm"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1.0.99"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }
huterm-core = { path = "crates/huterm-core", version = "=0.1.0" }
huterm-gpui = { path = "crates/huterm-gpui", version = "=0.1.0" }
huterm-protocol = { path = "crates/huterm-protocol", version = "=0.1.0" }
filedescriptor = "=0.8.3"
portable-pty = "=0.9.0"
nix = { version = "=0.29.0", features = ["fs", "process", "signal"] }
thiserror = "2.0.16"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "huterm"
description = "A native terminal emulator and multiplexer"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
huterm-gpui.workspace = true

[lints]
workspace = true
