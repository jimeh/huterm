[env]
# All builds use the reviewed native source prepared by Mise.
GHOSTTY_SOURCE_DIR = { value = ".native/ghostty/source", relative = true, force = true }
# The source archive has no Git metadata. Do not discover Huterm's release tags.
GIT_CEILING_DIRECTORIES = { value = ".native/ghostty", relative = true, force = true }
LIBGHOSTTY_VT_SYS_OPTIMIZE = { value = "ReleaseFast", force = true }
LIBGHOSTTY_VT_SYS_CPU = { value = "baseline", force = true }
