[package]
name = "huterm-core"
description = "PTY, emulator, runtime, and mux ownership for Huterm"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
ghostty = ["dep:libghostty-vt", "dep:libghostty-vt-sys"]

[dependencies]
# Keep the native binding/build pin aligned with scripts/ghostty-source.json.
libghostty-vt = { version = "=0.2.1", optional = true, default-features = false }
libghostty-vt-sys = { version = "=0.2.1", optional = true }
alacritty_terminal.workspace = true
async-channel.workspace = true
huterm-protocol.workspace = true
portable-pty.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
filedescriptor.workspace = true
nix.workspace = true

[lints]
workspace = true
