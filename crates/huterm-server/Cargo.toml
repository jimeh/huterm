[package]
name = "huterm-server"
description = "Runtime IPC server for Huterm: the per-connection protocol over a Mux"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.34.0"

[features]
default = []
# The test-only hierarchy feed that delivers test-minor events. Never enabled
# by a shipping server.
test-minor = ["huterm-wire/test-minor"]
# Raw wire helpers that tests use as a client: building Hello and request
# frames and decoding what the server sends.
test-support = ["huterm-socket/test-support"]

[dependencies]
async-channel.workspace = true
futures-lite.workspace = true
huterm-core.workspace = true
huterm-protocol.workspace = true
huterm-wire.workspace = true

[target.'cfg(unix)'.dependencies]
async-executor.workspace = true
async-io.workspace = true
blocking.workspace = true
huterm-socket.workspace = true
# The socket is non-blocking, so the driver writes what the socket takes at
# once and the reader and writer threads wait with `poll`.
nix.workspace = true

[dev-dependencies]
# The contract tests and the IPC benchmark drive the server through the
# real client. The client's tests depend on this crate the same way; Cargo
# allows the cycle because both edges are dev edges.
huterm-client.workspace = true
huterm-socket = { workspace = true, features = ["test-support"] }
# The test feed's tests deliver test-minor events, so the wire crate's
# test-only minor version is on whenever this crate's tests build.
huterm-wire = { workspace = true, features = ["test-minor"] }

[lints]
workspace = true
