[package]
name = "huterm-gpui"
description = "Native GPUI client for Huterm"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.20.0"

[features]
default = []
macos-updater = []
# GPUI's test helpers for the view harness tests. A dev-dependency would also
# build them into the smoke and benchmark examples, so tasks opt in instead.
test-support = ["gpui/test-support"]

[dependencies]
anyhow.workspace = true
huterm-config = { workspace = true, features = ["settings"] }
huterm-core.workspace = true
huterm-protocol.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui.workspace = true
gpui_platform.workspace = true
global-hotkey = "=0.9.0"
nucleo-matcher.workspace = true
raw-window-handle = "=0.6.2"
serde.workspace = true
serde_json = "=1.0.154"
async-channel.workspace = true
nix.workspace = true
notify = "=8.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["poll"] }
# Unifies into GPUI's font-kit so fontconfig loads at runtime, as it did before
# GPUI dropped this feature: no build headers or packaged link dependency.
zed-font-kit = { version = "=0.14.1-zed", default-features = false, features = ["source-fontconfig-dlopen"] }
x11rb = { version = "=0.14.0", features = ["randr"] }
