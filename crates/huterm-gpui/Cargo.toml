[package]
name = "huterm-gpui"
description = "Native GPUI client for Huterm"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.16.0"

[features]
default = []
macos-updater = []

[dependencies]
anyhow.workspace = true
huterm-config.workspace = true
huterm-core.workspace = true
huterm-protocol.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui.workspace = true
gpui_platform.workspace = true
global-hotkey = "=0.8.0"
nucleo-matcher.workspace = true
raw-window-handle = "=0.6.2"
async-channel.workspace = true
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["poll"] }
# Unifies into GPUI's font-kit so fontconfig loads at runtime, as it did before
# GPUI dropped this feature: no build headers or packaged link dependency.
zed-font-kit = { version = "=0.14.1-zed", default-features = false, features = ["source-fontconfig-dlopen"] }
x11rb = { version = "=0.14.0", features = ["randr"] }
