[package]
name = "huterm-ui"
description = "Generic GPUI components for Huterm's desktop client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.23.0"

[features]
default = []
# GPUI's test helpers for the component contract tests. `huterm-gpui`'s own
# `test-support` feature enables this one, so workspace tasks opt in instead of
# a dev-dependency building them into examples.
test-support = ["gpui/test-support"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
