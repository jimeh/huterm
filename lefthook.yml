pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      exclude:
        - "third-party/vendor/**"
      run: rustfmt --edition 2024 --check {staged_files}

    - name: rust-analysis
      glob: "{*.rs,Cargo.toml,**/Cargo.toml,Cargo.lock}"
      run: mise run check:rust:analysis

    - name: markdown
      glob: "**/*.md"
      exclude:
        - "third-party/vendor/gpui-0.2.2/**"
      run: mise run lint:docs:files {staged_files}

    - name: workflows
      glob: "{.github/workflows/*.{yml,yaml},.github/dependabot.yml,.pinact.yaml,zizmor.yml}"
      run: mise run ci:workflows

    - name: harness-config
      glob: "{mise.toml,mise.lock,lefthook.yml,rustfmt.toml,deny.toml}"
      run: mise tasks >/dev/null && lefthook validate

    - name: scripts
      glob: "{scripts/*.ts,scripts/*.sh,package.json,bun.lock,bunfig.toml,tsconfig.json}"
      run: mise run check:scripts
