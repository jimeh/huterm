version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: nix
        versions: [">= 0.30"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
