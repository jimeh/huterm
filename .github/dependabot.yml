version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    # One day above the 3-day policy: Dependabot counts calendar days, while
    # pinact, Mise, and Bun require a full 72 hours.
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: nix
        versions: [">= 0.30"]
      # Snapshot crates pin each other exactly and three are vendored with
      # patches; upgrade them together through the vendor workflow.
      - dependency-name: "gpui-pre*"
      # Must match GPUI's font-kit requirement so the dlopen feature unifies.
      - dependency-name: zed-font-kit

  - package-ecosystem: github-actions
    # "/" covers only workflows and a root action.yml, not local composite actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
    # One day above the 3-day policy: Dependabot counts calendar days, while
    # pinact, Mise, and Bun require a full 72 hours.
    cooldown:
      default-days: 4
    # The init and analyze steps must run the same codeql-action release.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
      # One PR per action bump across workflows and local composite actions.
      actions:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
    # One day above the 3-day policy: Dependabot counts calendar days, while
    # pinact, Mise, and Bun require a full 72 hours.
    cooldown:
      default-days: 4
