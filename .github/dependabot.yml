version: 2
# Each ecosystem opens one grouped pull request for all of its version
# updates, majors included. Security updates are not grouped, so an advisory
# fix lands on its own instead of waiting behind unrelated bumps.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    # One day above the 3-day policy: Dependabot counts calendar days, while
    # pinact, Mise, and Bun require a full 72 hours.
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: nix
        versions: [">= 0.30"]
      # Snapshot crates pin each other exactly and three are vendored with
      # patches; upgrade them together through the vendor workflow.
      - dependency-name: "gpui-pre*"
      # Must match GPUI's font-kit requirement so the dlopen feature unifies.
      - dependency-name: zed-font-kit
      # Pinned to the versions GPUI uses (see crates/huterm-gpui/Cargo.toml);
      # they move with a gpui-pre upgrade.
      - dependency-name: core-foundation
      - dependency-name: core-text
      - dependency-name: fontdb
      # Its 0.39 line needs accesskit 0.25, while GPUI and the vendored
      # accesskit_macos use 0.24; it moves with a gpui-pre upgrade.
      - dependency-name: accesskit_consumer
        versions: [">= 0.39"]
      # Matches the skrifa that swash, under GPUI's Linux text stack, accepts;
      # a newer one would add a second copy.
      - dependency-name: skrifa
        versions: [">= 0.45"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    # "/" covers only workflows and a root action.yml, not local composite actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
    # One day above the 3-day policy: Dependabot counts calendar days, while
    # pinact, Mise, and Bun require a full 72 hours.
    cooldown:
      default-days: 4
    # One PR across workflows and local composite actions, which also keeps
    # codeql-action's init and analyze steps on the same release.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
    # One day above the 3-day policy: Dependabot counts calendar days, while
    # pinact, Mise, and Bun require a full 72 hours.
    cooldown:
      default-days: 4
    groups:
      bun:
        patterns: ["*"]
