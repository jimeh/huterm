version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: nix
        versions: [">= 0.30"]
      # Snapshot crates pin each other exactly and three are vendored with
      # patches; upgrade them together through the vendor workflow.
      - dependency-name: "gpui-pre*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    # The init and analyze steps must run the same codeql-action release.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
