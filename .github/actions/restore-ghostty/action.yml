name: Restore prebuilt Ghostty
description: >-
  Restore the namespace's newest cached libghostty-vt archives and point the
  huterm-ghostty build script at them. The build script links an archive only
  when its fingerprint matches the current build, and stores fresh builds
  there. Also restores Zig's package cache for Ghostty's pinned dependencies.
  Run after setup-zig, and pair with save-ghostty after the job's builds.
inputs:
  namespace:
    description: >-
      Cache namespace. Jobs that build the same archives on the same runner
      image share one; a different image (libc or SDK) or set of build modes
      needs its own, because a restore takes the namespace's newest entry.
    required: true
outputs:
  prefix:
    description: Cache key prefix; save-ghostty appends a fingerprint hash.
    value: ${{ steps.key.outputs.prefix }}
  matched-key:
    description: The key the restore matched, or empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
    - name: Name the cache
      id: key
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: echo "prefix=huterm-ghostty-v1-$NAMESPACE-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"

    # Keys end in a hash of the stored slots, so the prefix alone restores
    # the newest archives saved for this namespace.
    - name: Restore cached archives
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .native/ghostty-prebuilt
        key: ${{ steps.key.outputs.prefix }}-restore
        restore-keys: ${{ steps.key.outputs.prefix }}-

    # setup-zig points ZIG_GLOBAL_CACHE_DIR at RUNNER_TEMP/zig-global-cache.
    # Its p directory holds Ghostty's pinned Zig packages, which
    # ghostty:prepare fetches; keeping them spares upstream package hosts.
    - name: Name the Zig package cache
      id: packages
      shell: bash
      run: |
        set -euo pipefail
        hash="$(shasum -a 256 scripts/ghostty-source.json | cut -c1-16)"
        echo "key=huterm-zig-packages-v1-$RUNNER_OS-$RUNNER_ARCH-$hash" >> "$GITHUB_OUTPUT"

    - name: Restore Zig packages
      id: restore-packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/zig-global-cache/p
        key: ${{ steps.packages.outputs.key }}

    # save-ghostty skips the save when this exact key was restored.
    - name: Record the restored Zig package key
      shell: bash
      env:
        MATCHED: ${{ steps.restore-packages.outputs.cache-matched-key }}
      run: printf '%s' "$MATCHED" > "$RUNNER_TEMP/huterm-zig-packages-restored"

    # Only a literal path in the checkout reaches GITHUB_ENV.
    - name: Point the build script at the cache
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "HUTERM_GHOSTTY_ARTIFACT_CACHE=$GITHUB_WORKSPACE/.native/ghostty-prebuilt" >> "$GITHUB_ENV"
