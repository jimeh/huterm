name: Save prebuilt Ghostty
description: >-
  Save the job's libghostty-vt archives when the build stored any the restore
  did not already hold. The key hashes every stored fingerprint, so a changed
  source pin, Zig version, libc, or SDK saves a new entry instead of leaving a
  stale one in place.
inputs:
  prefix:
    description: The prefix output of restore-ghostty.
    required: true
  matched-key:
    description: The matched-key output of restore-ghostty.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Hash the stored fingerprints
      id: key
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
      run: |
        shopt -s nullglob
        fingerprints=(.native/ghostty-prebuilt/*/fingerprint)
        if [ "${#fingerprints[@]}" -eq 0 ]; then
          echo "key=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        hash="$(cat "${fingerprints[@]}" | shasum -a 256 | cut -c1-64)"
        echo "key=$PREFIX-$hash" >> "$GITHUB_OUTPUT"

    - name: Save cached archives
      if: steps.key.outputs.key != '' && steps.key.outputs.key != inputs.matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .native/ghostty-prebuilt
        key: ${{ steps.key.outputs.key }}
