name: Save prebuilt Ghostty
description: >-
  Save the job's libghostty-vt archives when the build stored any the restore
  did not already hold. The key hashes every stored slot, fingerprint and
  archive alike, so a changed source pin, Zig version, libc, or SDK saves a new
  entry instead of leaving a stale one in place, and so does a slot rebuilt
  because its restored archive was unusable. Also saves Zig's package cache
  when restore-ghostty did not already restore it.
inputs:
  prefix:
    description: The prefix output of restore-ghostty.
    required: true
  matched-key:
    description: The matched-key output of restore-ghostty.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Hash the stored slots
      id: key
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        # Only slots with a fingerprint are complete. The glob also skips the
        # dot-named staging directories of interrupted stores.
        slots=()
        for fingerprint in .native/ghostty-prebuilt/*/fingerprint; do
          slots+=("$(dirname "$fingerprint")")
        done
        if [ "${#slots[@]}" -eq 0 ]; then
          echo "key=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        hash="$(find "${slots[@]}" -type f -print0 | LC_ALL=C sort -z \
          | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-64)"
        echo "key=$PREFIX-$hash" >> "$GITHUB_OUTPUT"

    - name: Save cached archives
      if: steps.key.outputs.key != '' && steps.key.outputs.key != inputs.matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .native/ghostty-prebuilt
        key: ${{ steps.key.outputs.key }}

    # setup-zig points ZIG_GLOBAL_CACHE_DIR at RUNNER_TEMP/zig-global-cache.
    # Its p directory holds Ghostty's pinned Zig packages, which
    # ghostty:prepare fetches; keeping them spares upstream package hosts.
    - name: Name the Zig package cache
      id: packages
      shell: bash
      run: |
        set -euo pipefail
        hash="$(shasum -a 256 scripts/ghostty-source.json | cut -c1-16)"
        echo "key=huterm-zig-packages-v1-$RUNNER_OS-$RUNNER_ARCH-$hash" >> "$GITHUB_OUTPUT"

    - name: Check whether the Zig packages need saving
      id: packages-needed
      shell: bash
      env:
        KEY: ${{ steps.packages.outputs.key }}
      run: |
        set -euo pipefail
        restored="$(cat "$RUNNER_TEMP/huterm-zig-packages-restored" 2>/dev/null || true)"
        if [ "$restored" != "$KEY" ] && [ -n "$(ls -A "$RUNNER_TEMP/zig-global-cache/p" 2>/dev/null)" ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Zig packages
      if: steps.packages-needed.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/zig-global-cache/p
        key: ${{ steps.packages.outputs.key }}
