name: Prepare release candidate
description: Verify the native publication tools and exact assembled candidate without release credentials
inputs:
  artifact-id:
    description: Exact assembled Actions artifact ID
    required: true
  artifact-digest:
    description: Expected Actions artifact SHA-256 digest without its prefix
    required: true
  github-token:
    description: Read-only token for Actions artifact access
    required: true
runs:
  using: composite
  steps:
    - name: Install publication tools with Mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        cache: false
        install_args: rust bun pipx:spdx-tools
        minimum_release_age: 3d

    - name: Materialize Rust toolchain
      shell: bash
      run: mise run ci:toolchain

    - name: Materialize verified Sparkle signing tools
      shell: bash
      run: bun scripts/prepare-sparkle.ts

    - name: Revalidate checked-out source and versions
      shell: bash
      run: bun scripts/release.ts validate-build

    - name: Validate candidate artifact identity
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EXPECTED_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        EXPECTED_ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: |
        set -euo pipefail
        actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}" --jq .digest)"
        if [[ "$actual_digest" != "sha256:$EXPECTED_ARTIFACT_DIGEST" ]]; then
          echo "candidate artifact digest mismatch" >&2
          exit 1
        fi

    - name: Download exact assembled candidate
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ env.RELEASE_DIST_DIR }}
        merge-multiple: true

    - name: Verify candidate and exercise fixture signing
      shell: bash
      run: mise run release:verify-candidate
