name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install policy tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install_args: actionlint markdownlint-cli2 pinact zizmor
          minimum_release_age: 3d

      - name: Verify repository policy
        run: mise run verify:policy

  verify:
    name: Verify macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install_args: rust bun zig cargo:cargo-packager
          minimum_release_age: 3d

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Verify Rust and both terminal engines
        run: mise run verify:platform

      - name: Verify native menu shortcuts
        run: mise run smoke:macos-menus

      - name: Verify native input through both engines
        run: mise run smoke:macos-input

      - name: Verify cancellable native Quit
        run: mise run smoke:macos-quit

      - name: Build and verify Huterm.app with both engines
        run: mise run package:macos

  verify-linux:
    name: Verify Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils

      - name: Install build tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install_args: rust bun zig cargo:cargo-deny
          minimum_release_age: 3d

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Verify Rust and both terminal engines
        run: mise run verify:platform

      - name: Audit dependencies
        run: |
          mise run license
          mise run audit:scripts

      - name: Smoke GPUI window under Xvfb
        run: mise run smoke:linux

      - name: Verify X11 terminal input
        run: mise run smoke:linux-input

      - name: Verify scroll performance budgets
        run: mise run bench:scroll

      - name: Verify Ghostty scroll performance budgets
        run: mise run bench:scroll:ghostty
