name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each job installs only its declared tools, including nested mise run calls.
  MISE_AUTO_INSTALL: 'false'

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun cargo:cargo-deny actionlint markdownlint-cli2 pinact zizmor
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: policy

      - name: Verify repository policy
        run: mise run verify:policy

      - name: Verify patched vendor sources
        run: mise run vendor:check

      - name: Audit Cargo dependencies
        run: mise run license

      - name: Audit scripting dependencies
        run: mise run audit:scripts

  checks:
    name: Checks (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            machine: x86_64
            runner-arch: X64
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
            runner-arch: ARM64
          - label: macOS arm64
            runner: macos-15
            machine: arm64
            runner-arch: ARM64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev zsh

      - name: Record Linux check evidence
        if: runner.os == 'Linux'
        run: |
          evidence="$RUNNER_TEMP/huterm-check-evidence"
          mkdir -p "$evidence"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "github_sha=$GITHUB_SHA"
            uname -a
          } > "$evidence/runner.txt"

      - name: Isolate Rust state on macOS
        if: runner.os == 'macOS'
        run: |
          echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.local/share/mise/cargo" >> "$GITHUB_ENV"

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Rustup state must remain complete when Mise's install state is restored.
          cache: ${{ runner.os != 'macOS' }}
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks-debug-${{ runner.arch }}

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Check Rust formatting
        run: mise run format:check

      - name: Run Clippy and architecture checks
        run: mise run ci:lint

      - name: Check schema generation on this platform
        run: mise run schema:check

      - name: Check repository scripts
        run: mise run check:scripts

      - name: Run Rust tests
        run: mise run ci:test

      - name: Upload Linux check failure evidence
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-evidence-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huterm-check-evidence

  smoke:
    name: Rust smoke (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            machine: x86_64
            runner-arch: X64
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
            runner-arch: ARM64
          - label: macOS arm64
            runner: macos-15
            machine: arm64
            runner-arch: ARM64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev zsh

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils \
            x11-utils openbox xcompmgr

      - name: Isolate Rust state on macOS
        if: runner.os == 'macOS'
        run: |
          echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.local/share/mise/cargo" >> "$GITHUB_ENV"

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Rustup state must remain complete when Mise's install state is restored.
          cache: ${{ runner.os != 'macOS' }}
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Avoid keys drifting with unrelated Rust versions on hosted images.
          add-rust-environment-hash-key: false
          key: smoke-debug-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/ghostty-source.json') }}
          cache-on-failure: true
          cache-workspace-crates: true
          cache-directories: .native/ghostty

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Prepare smoke evidence
        run: |
          evidence="$RUNNER_TEMP/huterm-smoke-evidence"
          mkdir -p "$evidence"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_name=$RUNNER_NAME"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "github_sha=$GITHUB_SHA"
            uname -a
          } > "$evidence/runner.txt"
          echo "HUTERM_SMOKE_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Prepare desktop smoke dependencies
        run: |
          mise run ghostty:prepare
          mise run sparkle:prepare

      - name: Compile desktop smoke binaries
        run: mise run ci:smoke:build


      - name: Smoke renderer
        run: HUTERM_CI_SMOKE_STEP=renderer mise run ci:smoke:run

      - name: Smoke Linux desktop
        if: runner.os == 'Linux'
        run: HUTERM_CI_SMOKE_STEP=linux-desktop mise run ci:smoke:run

      - name: Smoke macOS menus
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-menus mise run ci:smoke:run

      - name: Smoke packaged macOS updater
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-updater mise run ci:smoke:run

      - name: Smoke Linux input
        if: runner.os == 'Linux'
        run: HUTERM_CI_SMOKE_STEP=linux-input mise run ci:smoke:run

      - name: Smoke macOS input
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-input mise run ci:smoke:run

      - name: Smoke Linux integration
        if: runner.os == 'Linux'
        run: HUTERM_CI_SMOKE_STEP=linux-integration mise run ci:smoke:run

      - name: Smoke macOS integration
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-integration mise run ci:smoke:run

      - name: Smoke native Quit
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-quit mise run ci:smoke:run

      - name: Smoke Linux fullscreen
        if: runner.os == 'Linux'
        run: HUTERM_CI_SMOKE_STEP=linux-fullscreen mise run ci:smoke:run

      - name: Smoke macOS fullscreen
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-fullscreen mise run ci:smoke:run

      - name: Smoke Linux quake windows
        if: runner.os == 'Linux'
        run: HUTERM_CI_SMOKE_STEP=linux-quake mise run ci:smoke:run

      - name: Smoke macOS quake windows
        if: runner.os == 'macOS'
        run: HUTERM_CI_SMOKE_STEP=macos-quake mise run ci:smoke:run

      - name: Upload smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huterm-smoke-evidence

  benchmarks:
    name: Scroll benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: benchmarks-release

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Verify scroll budgets for both engines
        run: mise run ci:benchmarks

  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            machine: arm64
            runner-arch: ARM64
            task: package:macos
          - label: Linux x86_64
            runner: ubuntu-22.04
            machine: x86_64
            runner-arch: X64
            task: package:linux
          - label: Linux aarch64
            runner: ubuntu-22.04-arm
            machine: aarch64
            runner-arch: ARM64
            task: package:linux
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Install Linux build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream build-essential ca-certificates clang cmake curl \
            desktop-file-utils file fontconfig fonts-dejavu-core git locales \
            libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers openbox \
            patchelf pax-utils pkg-config python3 ripgrep rsync xauth xcompmgr \
            xdotool x11-xkb-utils x11-utils xvfb xz-utils zsh

      - name: Isolate Rust state on macOS
        if: runner.os == 'macOS'
        run: |
          echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.local/share/mise/cargo" >> "$GITHUB_ENV"

      - name: Install macOS package tools with Mise
        if: runner.os == 'macOS'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Install Linux package tools with Mise
        if: runner.os == 'Linux'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Install macOS Cargo package tools
        if: runner.os == 'macOS'
        run: |
          mise install --locked cargo:cargo-auditable
          mise install --locked cargo:cargo-packager

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-release-${{ runner.arch }}

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Build and verify native package with both engines
        run: mise run ${{ matrix.task }}

      - name: Upload Linux package evidence on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ runner.arch }}-${{ github.run_attempt }}
          path: dist/linux/${{ matrix.machine }}/package-evidence
          if-no-files-found: ignore

  verify:
    # Preserve the required check names configured in the repository ruleset.
    # These historical labels now cover both native Linux architectures because
    # matrix results are aggregated by job ID.
    name: Verify ${{ matrix.platform }}
    needs: [policy, checks, smoke, benchmarks, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux x86_64, macOS arm64]
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
