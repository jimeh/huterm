name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each job installs only its declared tools, including nested mise run calls.
  MISE_AUTO_INSTALL: 'false'

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun cargo:cargo-deny actionlint markdownlint-cli2 pinact zizmor
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: policy

      - name: Verify repository policy
        run: mise run verify:policy

      - name: Verify patched vendor sources
        run: mise run vendor:check

      - name: Audit Cargo dependencies
        run: mise run license

      - name: Audit scripting dependencies
        run: mise run audit:scripts

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev zsh

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks-debug

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Check Rust formatting
        run: mise run format:check

      - name: Run Clippy and architecture checks
        run: mise run ci:lint

      - name: Check schema generation on this platform
        run: mise run schema:check

      - name: Check repository scripts
        run: mise run check:scripts

      - name: Run Rust tests
        run: mise run ci:test

  smoke:
    name: Rust smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev zsh

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils \
            x11-utils openbox xcompmgr

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Avoid keys drifting with unrelated Rust versions on hosted images.
          add-rust-environment-hash-key: false
          key: smoke-debug-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/ghostty-source.json') }}
          cache-on-failure: true
          cache-workspace-crates: true
          cache-directories: .native/ghostty

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Prepare desktop smoke dependencies
        run: mise run ghostty:prepare

      - name: Compile desktop smoke binaries
        run: mise run ci:smoke:build

      - name: Run desktop smoke tests
        run: mise run ci:smoke:run

  benchmarks:
    name: Scroll benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: benchmarks-release

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Verify scroll budgets for both engines
        run: mise run ci:benchmarks

  package:
    name: Package macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: rust bun zig cargo:cargo-packager
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run verify:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-release

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Build and verify Huterm.app with both engines
        run: mise run package:macos

  verify:
    # Preserve the required check names configured in the repository ruleset.
    # Both gates require every job because matrix results are aggregated by job ID.
    name: Verify ${{ matrix.platform }}
    needs: [policy, checks, smoke, benchmarks, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux x86_64, macOS arm64]
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
