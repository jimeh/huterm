name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each job installs only its declared tools, including nested mise run calls.
  MISE_AUTO_INSTALL: 'false'
  # Line tables keep symbolized backtraces while shrinking debug builds and
  # their caches. Keys without Rust's environment hash must include this value.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install job tools with Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun actionlint markdownlint-cli2 pinact taplo zizmor
          version: 2026.9.14

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Install Cargo policy tools
        run: mise install --locked cargo:cargo-deny

      - name: Cache Cargo dependencies and build artifacts
        id: policy-setup
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: policy
          # PRs restore main's caches; per-PR copies overflow the repository limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each check below runs once setup succeeds, even after an earlier check
      # fails, so one run reports every failing check.
      - name: Lint Markdown
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        run: mise run lint:docs

      - name: Check agent guides
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        run: mise run lint:agents

      - name: Check workflows and action pins
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: mise run ci:workflows

      - name: Smoke config schema in Taplo
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        run: mise run smoke:schema-editor

      - name: Verify patched vendor sources
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        run: mise run vendor:check

      - name: Audit Cargo dependencies
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        run: mise run license

      - name: Audit scripting dependencies
        if: ${{ !cancelled() && steps.policy-setup.outcome == 'success' }}
        run: mise run audit:scripts

  checks:
    name: Checks (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            machine: x86_64
            runner-arch: X64
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
            runner-arch: ARM64
          - label: macOS arm64
            runner: macos-15
            machine: arm64
            runner-arch: ARM64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev zsh

      - name: Record Linux check evidence
        if: runner.os == 'Linux'
        run: |
          evidence="$RUNNER_TEMP/huterm-check-evidence"
          mkdir -p "$evidence"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "github_sha=$GITHUB_SHA"
            uname -a
          } > "$evidence/runner.txt"

      - name: Isolate Rust state on macOS
        if: runner.os == 'macOS'
        run: |
          echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.local/share/mise/cargo" >> "$GITHUB_ENV"

      - name: Install job tools with Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          # Rustup state must remain complete when Mise's install state is restored.
          cache: ${{ runner.os != 'macOS' }}
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun
          version: 2026.9.14

      - name: Install Zig
        id: zig
        # A stalled mirror holds setup-zig for about 14 minutes; a retry
        # reshuffles the mirrors. actionlint rejects the $/ self-repository syntax.
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Retry Zig installation
        if: steps.zig.outcome != 'success'
        timeout-minutes: 6
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks-debug-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore prebuilt Ghostty
        id: ghostty
        uses: ./.github/actions/restore-ghostty # zizmor: ignore[self-repository]
        with:
          namespace: test

      - name: Check platform prerequisites
        id: checks-setup
        run: mise run doctor

      # Each check below runs once setup succeeds, even after an earlier check
      # fails, so one run reports every failing check.
      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.checks-setup.outcome == 'success' }}
        run: mise run format:check

      - name: Run Clippy and architecture checks
        if: ${{ !cancelled() && steps.checks-setup.outcome == 'success' }}
        run: mise run ci:lint

      - name: Check schema generation on this platform
        if: ${{ !cancelled() && steps.checks-setup.outcome == 'success' }}
        run: mise run schema:check

      # The task loads libclang from the selected Xcode, the runner image's
      # default that also builds this job, and logs its version. The
      # committed output matches libclang 14 through Apple clang 21, so one
      # platform suffices; the Linux runners would load whichever unpinned
      # LLVM their image ships.
      - name: Check generated Ghostty bindings
        if: ${{ !cancelled() && steps.checks-setup.outcome == 'success' && runner.os == 'macOS' }}
        run: mise run ghostty:bindings:check

      - name: Check repository scripts
        if: ${{ !cancelled() && steps.checks-setup.outcome == 'success' }}
        run: mise run check:scripts

      - name: Run Rust tests
        if: ${{ !cancelled() && steps.checks-setup.outcome == 'success' }}
        run: mise run ci:test

      - name: Upload Linux check failure evidence
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-evidence-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huterm-check-evidence

      - name: Save prebuilt Ghostty
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ghostty # zizmor: ignore[self-repository]
        with:
          prefix: ${{ steps.ghostty.outputs.prefix }}
          matched-key: ${{ steps.ghostty.outputs.matched-key }}

  smoke:
    name: Rust smoke (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            machine: x86_64
            runner-arch: X64
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
            runner-arch: ARM64
          - label: macOS arm64
            runner: macos-15
            machine: arm64
            runner-arch: ARM64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev zsh

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils \
            x11-utils openbox xcompmgr xclip ncurses-bin python3 tmux

      - name: Install macOS smoke dependencies
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Isolate Rust state on macOS
        if: runner.os == 'macOS'
        run: |
          echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.local/share/mise/cargo" >> "$GITHUB_ENV"

      - name: Install job tools with Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          # Rustup state must remain complete when Mise's install state is restored.
          cache: ${{ runner.os != 'macOS' }}
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun
          version: 2026.9.14

      - name: Install Zig
        id: zig
        # A stalled mirror holds setup-zig for about 14 minutes; a retry
        # reshuffles the mirrors. actionlint rejects the $/ self-repository syntax.
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Retry Zig installation
        if: steps.zig.outcome != 'success'
        timeout-minutes: 6
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Avoid keys drifting with unrelated Rust versions on hosted images.
          add-rust-environment-hash-key: false
          key: smoke-debug-${{ runner.arch }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/ghostty-source.json') }}
          cache-on-failure: true
          cache-workspace-crates: true
          cache-directories: .native/ghostty
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore prebuilt Ghostty
        id: ghostty
        uses: ./.github/actions/restore-ghostty # zizmor: ignore[self-repository]
        with:
          namespace: test

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Prepare smoke evidence
        run: |
          evidence="$RUNNER_TEMP/huterm-smoke-evidence"
          mkdir -p "$evidence"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_name=$RUNNER_NAME"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "github_sha=$GITHUB_SHA"
            uname -a
          } > "$evidence/runner.txt"
          echo "HUTERM_SMOKE_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Prepare desktop smoke dependencies
        id: smoke-prepare
        run: |
          mise run ghostty:prepare
          mise run terminfo:prepare
          mise run sparkle:prepare

      - name: Check terminfo entry and tmux RGB output
        if: ${{ !cancelled() && steps.smoke-prepare.outcome == 'success' }}
        run: mise run terminfo:check

      - name: Compile desktop smoke binaries
        id: smoke-build
        if: ${{ !cancelled() && steps.smoke-prepare.outcome == 'success' }}
        run: mise run ci:smoke:build

      - name: Smoke renderer
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=renderer mise run ci:smoke:step

      - name: Smoke terminal presentation queries
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=presentation-queries mise run ci:smoke:step

      - name: Smoke Linux desktop
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-desktop mise run ci:smoke:step

      - name: Smoke macOS menus
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-menus mise run ci:smoke:step

      - name: Smoke packaged macOS updater
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-updater mise run ci:smoke:step

      - name: Smoke Linux input
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-input mise run ci:smoke:step

      - name: Smoke macOS input
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-input mise run ci:smoke:step

      - name: Smoke macOS refresh scheduling
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-refresh mise run ci:smoke:step

      - name: Smoke Linux clipboard
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-clipboard mise run ci:smoke:step

      - name: Smoke macOS clipboard
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-clipboard mise run ci:smoke:step

      - name: Smoke Linux command palette
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-palette mise run ci:smoke:step

      - name: Smoke macOS command palette
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-palette mise run ci:smoke:step

      - name: Smoke Linux overlays
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-overlays mise run ci:smoke:step

      - name: Smoke macOS overlays
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-overlays mise run ci:smoke:step

      - name: Smoke Linux client-side frame
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-client-frame mise run ci:smoke:step

      - name: Smoke macOS title bar
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-titlebar mise run ci:smoke:step

      - name: Smoke Linux integration
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-integration mise run ci:smoke:step

      - name: Smoke macOS integration
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-integration mise run ci:smoke:step

      - name: Smoke native Quit
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-quit mise run ci:smoke:step

      - name: Smoke Linux fullscreen
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-fullscreen mise run ci:smoke:step

      - name: Smoke macOS fullscreen
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-fullscreen mise run ci:smoke:step

      - name: Smoke Linux quake windows
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=linux-quake mise run ci:smoke:step

      - name: Smoke macOS quake windows
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 6
        run: HUTERM_CI_SMOKE_STEP=macos-quake mise run ci:smoke:step

      - name: Upload smoke evidence
        if: ${{ !cancelled() && (steps.smoke-build.outcome == 'success' || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huterm-smoke-evidence

      - name: Save prebuilt Ghostty
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ghostty # zizmor: ignore[self-repository]
        with:
          prefix: ${{ steps.ghostty.outputs.prefix }}
          matched-key: ${{ steps.ghostty.outputs.matched-key }}

  benchmarks:
    name: Scroll benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils

      - name: Install job tools with Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun
          version: 2026.9.14

      - name: Install Zig
        id: zig
        # A stalled mirror holds setup-zig for about 14 minutes; a retry
        # reshuffles the mirrors. actionlint rejects the $/ self-repository syntax.
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Retry Zig installation
        if: steps.zig.outcome != 'success'
        timeout-minutes: 6
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: benchmarks-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore prebuilt Ghostty
        id: ghostty
        uses: ./.github/actions/restore-ghostty # zizmor: ignore[self-repository]
        with:
          namespace: test

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Verify Ghostty scroll and link budgets
        run: mise run ci:benchmarks

      - name: Save prebuilt Ghostty
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ghostty # zizmor: ignore[self-repository]
        with:
          prefix: ${{ steps.ghostty.outputs.prefix }}
          matched-key: ${{ steps.ghostty.outputs.matched-key }}

  releasesafe:
    # Normal builds link Ghostty in ReleaseFast, where a bounds, overflow, or
    # enum-tag violation triggered by Huterm's inputs is silent undefined
    # behavior. ReleaseSafe turns those into test failures. One platform
    # suffices because the checks guard Ghostty's own Zig code.
    name: Ghostty ReleaseSafe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install job tools with Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun
          version: 2026.9.14

      - name: Install Zig
        id: zig
        # A stalled mirror holds setup-zig for about 14 minutes; a retry
        # reshuffles the mirrors. actionlint rejects the $/ self-repository syntax.
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Retry Zig installation
        if: steps.zig.outcome != 'success'
        timeout-minutes: 6
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ghostty-releasesafe
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore prebuilt Ghostty
        id: ghostty
        uses: ./.github/actions/restore-ghostty # zizmor: ignore[self-repository]
        with:
          namespace: releasesafe

      - name: Run tests against ReleaseSafe Ghostty
        run: mise run ci:test:ghostty-releasesafe

      - name: Save prebuilt Ghostty
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ghostty # zizmor: ignore[self-repository]
        with:
          prefix: ${{ steps.ghostty.outputs.prefix }}
          matched-key: ${{ steps.ghostty.outputs.matched-key }}

  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            machine: arm64
            runner-arch: ARM64
            task: package:macos
          - label: Linux x86_64
            runner: ubuntu-22.04
            machine: x86_64
            runner-arch: X64
            task: ci:package:linux
          - label: Linux aarch64
            runner: ubuntu-22.04-arm
            machine: aarch64
            runner-arch: ARM64
            task: ci:package:linux
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Install Linux build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream build-essential ca-certificates clang cmake curl \
            desktop-file-utils file fontconfig fonts-dejavu-core git locales \
            libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers openbox \
            ncurses-bin patchelf pax-utils pkg-config python3 ripgrep rsync xauth xcompmgr \
            xdotool x11-xkb-utils x11-utils xvfb xz-utils zsh

      - name: Isolate Rust state on macOS
        if: runner.os == 'macOS'
        run: |
          echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.local/share/mise/cargo" >> "$GITHUB_ENV"

      - name: Install macOS package tools with Mise
        if: runner.os == 'macOS'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun
          version: 2026.9.14

      - name: Install Linux package tools with Mise
        if: runner.os == 'Linux'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun
          version: 2026.9.14

      - name: Install Zig
        id: zig
        # A stalled mirror holds setup-zig for about 14 minutes; a retry
        # reshuffles the mirrors. actionlint rejects the $/ self-repository syntax.
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Retry Zig installation
        if: steps.zig.outcome != 'success'
        timeout-minutes: 6
        uses: ./.github/actions/setup-zig # zizmor: ignore[self-repository]

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Install macOS Cargo package tools
        if: runner.os == 'macOS'
        run: |
          mise install --locked cargo:cargo-auditable
          mise install --locked cargo:cargo-packager

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-release-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore prebuilt Ghostty
        id: ghostty
        uses: ./.github/actions/restore-ghostty # zizmor: ignore[self-repository]
        with:
          namespace: package

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Build and verify native package
        run: mise run ${{ matrix.task }}

      - name: Upload Linux package evidence on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ runner.arch }}-${{ github.run_attempt }}
          path: dist/linux/${{ matrix.machine }}/package-evidence
          if-no-files-found: ignore

      - name: Save prebuilt Ghostty
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-ghostty # zizmor: ignore[self-repository]
        with:
          prefix: ${{ steps.ghostty.outputs.prefix }}
          matched-key: ${{ steps.ghostty.outputs.matched-key }}

  verify:
    # Preserve the required check names configured in the repository ruleset.
    # These historical labels now cover both native Linux architectures because
    # matrix results are aggregated by job ID.
    name: Verify ${{ matrix.platform }}
    needs: [policy, checks, smoke, benchmarks, releasesafe, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux x86_64, macOS arm64]
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
