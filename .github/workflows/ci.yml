name: PR 147 same-runner diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  benchmarks:
    name: Scroll benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            mesa-vulkan-drivers twm xvfb xdotool x11-xkb-utils

      - name: Install job tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          # Lock and toolchain inputs exclude task-only edits from tool cache keys.
          cache_key: huterm-mise-v2-{{version}}-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.lock', 'rust-toolchain.toml') }}
          install_args: bun zig
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: benchmarks-release

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Measure PR head
        continue-on-error: true
        run: mise run bench:scroll

      - name: Prepare isolated baseline with the same collector
        run: |
          git fetch --depth=1 origin c3ab933e5c79c8c41a63616d4a0205db12e0d984
          comparison_dir="$RUNNER_TEMP/huterm-baseline"
          git worktree add --detach "$comparison_dir" c3ab933e5c79c8c41a63616d4a0205db12e0d984
          cp -a target "$comparison_dir/target"
          cp scripts/run-scroll-benchmark.ts "$comparison_dir/scripts/run-scroll-benchmark.ts"
          mise trust "$comparison_dir/mise.toml"
          cd "$comparison_dir"
          mise exec -- cargo clean --release -p huterm -p huterm-core -p huterm-gpui -p huterm-protocol -p huterm-config

      - name: Measure baseline on the same runner
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/huterm-baseline"
          mise run bench:scroll

      - name: Queue snapshot starts after synchronous frame drawing
        run: cp scripts/pr147-refresh-candidate.txt crates/huterm-gpui/src/desktop/refresh.rs

      - name: Measure corrected benchmark on the same runner
        continue-on-error: true
        run: mise run bench:scroll

      - name: Repeat corrected benchmark on the same runner
        continue-on-error: true
        run: mise run bench:scroll
