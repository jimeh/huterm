name: CodeQL Swift

# Swift analysis holds a macOS runner, which CI's macOS jobs share across the
# account, so it runs only when the smoke helpers or this workflow change.
on:
  pull_request:
    paths:
      - '**/*.swift'
      - .github/workflows/codeql-swift.yml
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - .github/workflows/codeql-swift.yml
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Mise for the Swift build task
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false
          version: 2026.10.25

      # Advanced setup is required to trace the standalone swiftc invocation.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Compile Swift helper
        run: mise run build:swift

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
