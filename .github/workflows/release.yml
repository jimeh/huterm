name: Release

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the existing draft release after verification
        required: true
        type: boolean
      sha:
        description: Expected workflow event SHA (must equal github.sha)
        required: true
        type: string
      tag:
        description: Exact tag associated with the draft release
        required: true
        type: string
      version:
        description: Exact release version without the v prefix
        required: true
        type: string
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        description: Private key for the release bot GitHub App
        required: true
      MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64:
        description: Base64-encoded Developer ID Application identity
        required: true
      MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD:
        description: Password for the Developer ID PKCS#12 identity
        required: true
      APPLE_NOTARIZATION_KEY_P8_BASE64:
        description: Base64-encoded App Store Connect API private key
        required: true
      SPARKLE_EDDSA_PRIVATE_KEY:
        description: Repository secret for appcast signing, required when publishing
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing matching draft release
        required: true
        default: false
        type: boolean
      sha:
        description: Expected SHA of the selected ref (must equal github.sha)
        required: true
        type: string
      tag:
        description: Exact tag associated with the draft, required when publishing
        required: false
        type: string
      version:
        description: Exact release version without the v prefix
        required: true
        type: string

concurrency:
  group: release-${{ inputs.publish && inputs.tag || github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  MISE_AUTO_INSTALL: 'false'
  RELEASE_SHA: ${{ github.sha }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Validate source selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release SHA must be 40 lowercase hexadecimal characters" >&2
            exit 1
          fi

          if [[ "$GITHUB_SHA" != "$RELEASE_SHA" ]]; then
            echo "workflow source SHA $GITHUB_SHA does not match release SHA $RELEASE_SHA" >&2
            exit 1
          fi

          # Fail before expensive builds if the workflow identity cannot issue
          # attestations for this release source.
          if [[ "$RELEASE_PUBLISH" == true ]]; then
            if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              :
            elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]; then
              :
            else
              echo "publishing attestations requires the normal main ref or an exact-tag recovery dispatch" >&2
              exit 1
            fi
          fi

          # Manual verification may build the exact branch commit chosen at dispatch.
          if [[ "$RELEASE_PUBLISH" == false && "$GITHUB_EVENT_NAME" == workflow_dispatch &&
                "$GITHUB_REF" == refs/heads/* && "$RELEASE_SHA" == "$GITHUB_SHA" ]]; then
            :
          else
            source_status="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_SHA}...main" \
              --jq .status)"
            case "$source_status" in
              ahead | identical) ;;
              *)
                echo "release SHA must be an ancestor of main, comparison status: $source_status" >&2
                exit 1
                ;;
            esac
          fi

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install preflight tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: rust bun
          minimum_release_age: 3d

      - name: Validate checked-out source and versions
        run: bun scripts/release.ts validate-build

      - name: Validate committed schemas
        run: mise run schema:check

      - id: draft-token
        name: Create draft validation token
        if: inputs.publish
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # GitHub hides draft releases from callers without push access.
          permission-contents: write

      - id: draft
        name: Validate exact draft release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ steps.draft-token.outputs.token }}
        run: bun scripts/release.ts validate-release

  macos:
    name: Build signed macOS package
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    env:
      CARGO_HOME: /Users/runner/.local/share/mise/cargo
      RELEASE_DIST_DIR: ${{ github.workspace }}/dist-macos
      RUSTUP_HOME: /Users/runner/.local/share/mise/rustup
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install macOS release tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: rust bun zig syft pipx:spdx-tools
          minimum_release_age: 3d

      - name: Materialize Rust toolchain
        run: mise run ci:toolchain

      - name: Install Cargo release tools
        run: |
          mise install --locked cargo:cargo-auditable
          mise install --locked cargo:cargo-packager

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Revalidate checked-out source and versions
        run: bun scripts/release.ts validate-build

      - name: Build, sign, notarize, and inventory universal app
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: mise run release:macos

      - name: Record macOS payload digest
        run: |
          bun scripts/release.ts write-platform-manifest \
            "$RELEASE_DIST_DIR/macos-SHA256SUMS" \
            "$RELEASE_DIST_DIR/Huterm-$RELEASE_VERSION-macOS-universal.zip" \
            "$RELEASE_DIST_DIR/Huterm-$RELEASE_VERSION-macOS-universal.spdx.json" \
            "$RELEASE_DIST_DIR/appcast.xml"

      - id: artifact-name
        name: Record macOS artifact name
        env:
          ARTIFACT_NAME: release-macos-${{ github.sha }}-${{ github.run_attempt }}
        run: printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload verified macOS payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            dist-macos/Huterm-${{ inputs.version }}-macOS-universal.zip
            dist-macos/Huterm-${{ inputs.version }}-macOS-universal.spdx.json
            dist-macos/appcast.xml
            dist-macos/macos-SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Clean temporary signing state
        if: always()
        run: bun scripts/release-macos.ts cleanup

  linux_x86_64:
    name: Build Linux x86_64 package
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    env:
      RELEASE_ARCH: x86_64
    steps:
      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: x86_64
          EXPECTED_RUNNER_ARCH: X64
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Linux build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream build-essential ca-certificates clang cmake curl \
            desktop-file-utils file fontconfig fonts-dejavu-core git locales \
            libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers openbox \
            patchelf pax-utils pkg-config python3 ripgrep rsync xauth xcompmgr \
            xdotool x11-xkb-utils x11-utils xvfb xz-utils zsh

      - name: Install Linux release tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Revalidate checked-out source and versions
        run: bun scripts/release.ts validate-build

      - name: Set reproducible source time
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$RELEASE_SHA")" >> "$GITHUB_ENV"

      - name: Build and verify Linux artifacts
        run: mise run ci:package:linux

      - name: Stage Linux payloads and digest
        run: |
          stage="$RUNNER_TEMP/huterm-linux-dist"
          mkdir -p "$stage"
          cp "dist/linux/$RELEASE_ARCH/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.AppImage" "$stage/"
          cp "dist/linux/$RELEASE_ARCH/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.tar.gz" "$stage/"
          bun scripts/release.ts write-platform-manifest \
            "$stage/linux-$RELEASE_ARCH-SHA256SUMS" \
            "$stage/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.AppImage" \
            "$stage/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.tar.gz"

      - id: artifact-name
        name: Record Linux artifact name
        env:
          ARTIFACT_NAME: release-linux-x86_64-${{ github.sha }}-${{ github.run_attempt }}
        run: printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload verified Linux payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/huterm-linux-dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Upload Linux package evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-evidence-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/linux/x86_64/package-evidence
          if-no-files-found: ignore

  linux_aarch64:
    name: Build Linux aarch64 package
    needs: preflight
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    env:
      RELEASE_ARCH: aarch64
    steps:
      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: aarch64
          EXPECTED_RUNNER_ARCH: ARM64
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Linux build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream build-essential ca-certificates clang cmake curl \
            desktop-file-utils file fontconfig fonts-dejavu-core git locales \
            libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers openbox \
            patchelf pax-utils pkg-config python3 ripgrep rsync xauth xcompmgr \
            xdotool x11-xkb-utils x11-utils xvfb xz-utils zsh

      - name: Install Linux release tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: rust bun zig
          minimum_release_age: 3d

      - name: Check platform prerequisites
        run: mise run doctor

      - name: Revalidate checked-out source and versions
        run: bun scripts/release.ts validate-build

      - name: Set reproducible source time
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$RELEASE_SHA")" >> "$GITHUB_ENV"

      - name: Build and verify Linux artifacts
        run: mise run ci:package:linux

      - name: Stage Linux payloads and digest
        run: |
          stage="$RUNNER_TEMP/huterm-linux-dist"
          mkdir -p "$stage"
          cp "dist/linux/$RELEASE_ARCH/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.AppImage" "$stage/"
          cp "dist/linux/$RELEASE_ARCH/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.tar.gz" "$stage/"
          bun scripts/release.ts write-platform-manifest \
            "$stage/linux-$RELEASE_ARCH-SHA256SUMS" \
            "$stage/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.AppImage" \
            "$stage/Huterm-$RELEASE_VERSION-Linux-$RELEASE_ARCH.tar.gz"

      - id: artifact-name
        name: Record Linux artifact name
        env:
          ARTIFACT_NAME: release-linux-aarch64-${{ github.sha }}-${{ github.run_attempt }}
        run: printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload verified Linux payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/huterm-linux-dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Upload Linux package evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-evidence-aarch64-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/linux/aarch64/package-evidence
          if-no-files-found: ignore

  assemble:
    name: Assemble and verify release
    needs: [preflight, macos, linux_x86_64, linux_aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.candidate.outputs.artifact-digest }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    env:
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      RELEASE_INCOMING_DIR: ${{ github.workspace }}/.release-incoming
      RELEASE_DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install assembly tools with Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: rust bun
          minimum_release_age: 3d

      - name: Revalidate checked-out source and versions
        run: bun scripts/release.ts validate-build

      - name: Download exact macOS payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.macos.outputs.artifact_name }}
          path: .release-incoming/macos

      - name: Download exact Linux x86_64 payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux_x86_64.outputs.artifact_name }}
          path: .release-incoming/linux-x86_64

      - name: Download exact Linux aarch64 payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux_aarch64.outputs.artifact_name }}
          path: .release-incoming/linux-aarch64

      - name: Assemble exact release inventory
        run: bun scripts/release.ts assemble

      - id: candidate
        name: Upload exact assembled candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Huterm-${{ inputs.version }}-all-platforms-verified-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  verify_candidate:
    name: Verify publication candidate without publishing
    needs: [preflight, assemble]
    if: ${{ !inputs.publish }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      CARGO_HOME: /Users/runner/.local/share/mise/cargo
      RELEASE_DIST_DIR: ${{ github.workspace }}/dist
      RUSTUP_HOME: /Users/runner/.local/share/mise/rustup
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare and verify exact release candidate
        # The local action uses the same immutable event SHA as this workflow.
        uses: ./.github/actions/prepare-release-candidate # zizmor: ignore[self-repository]
        with:
          artifact-id: ${{ needs.assemble.outputs.artifact_id }}
          artifact-digest: ${{ needs.assemble.outputs.artifact_digest }}
          github-token: ${{ github.token }}

  publish:
    name: Attest and publish release
    needs: [preflight, assemble]
    if: inputs.publish
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      CARGO_HOME: /Users/runner/.local/share/mise/cargo
      RELEASE_DIST_DIR: ${{ github.workspace }}/dist
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
      RUSTUP_HOME: /Users/runner/.local/share/mise/rustup
    steps:
      - name: Validate attestation source identity
        run: |
          set -euo pipefail
          if [[ "$GITHUB_SHA" != "$RELEASE_SHA" ]]; then
            echo "workflow source SHA $GITHUB_SHA does not match release SHA $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            exit 0
          fi
          echo "publishing attestations requires the normal main ref or an exact-tag recovery dispatch" >&2
          exit 1

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare and verify exact release candidate
        # The local action uses the same immutable event SHA as this workflow.
        uses: ./.github/actions/prepare-release-candidate # zizmor: ignore[self-repository]
        with:
          artifact-id: ${{ needs.assemble.outputs.artifact_id }}
          artifact-digest: ${{ needs.assemble.outputs.artifact_digest }}
          github-token: ${{ github.token }}

      - id: app-token
        name: Create fresh release bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - id: draft
        name: Revalidate exact draft release
        env:
          EXPECTED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          bun scripts/release.ts validate-release
          actual_id="$(tail -n 1 "$GITHUB_OUTPUT" | cut -d= -f2)"
          if [[ "$actual_id" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "draft release changed across the artifact boundary" >&2
            exit 1
          fi

      - name: Generate signed appcast and final checksums
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" |
            env -u SPARKLE_EDDSA_PRIVATE_KEY bun scripts/release-macos.ts finalize-metadata

      - name: Upload and verify draft assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun scripts/release.ts upload-assets

      - name: Attest macOS build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Huterm-${{ inputs.version }}-macOS-universal.zip

      - name: Attest macOS SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Huterm-${{ inputs.version }}-macOS-universal.zip
          sbom-path: dist/Huterm-${{ inputs.version }}-macOS-universal.spdx.json

      - name: Verify both local attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="dist/Huterm-${RELEASE_VERSION}-macOS-universal.zip"
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-ref "$GITHUB_REF" --source-digest "$RELEASE_SHA"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-ref "$GITHUB_REF" --source-digest "$RELEASE_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # GitHub Releases has no OIDC trusted-publishing exchange.
        run: |
          bun scripts/release-macos.ts verify-release-metadata
          bun scripts/release.ts publish # zizmor: ignore[use-trusted-publishing]

      - name: Probe public updater feed and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLIC_DIR: ${{ runner.temp }}/huterm-public-release
        run: |
          set -euo pipefail
          bun scripts/release-macos.ts probe-public
          archive="$RELEASE_PUBLIC_DIR/Huterm-${RELEASE_VERSION}-macOS-universal.zip"
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-ref "$GITHUB_REF" --source-digest "$RELEASE_SHA"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-ref "$GITHUB_REF" --source-digest "$RELEASE_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3
