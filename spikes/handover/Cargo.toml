# Throwaway spike harness for #394. Not part of the Huterm workspace and never
# merged; see docs/research/server-handover-spike.md on main.
[package]
name = "handover-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "=0.2.191"
portable-pty = { path = "../../third-party/vendor/portable-pty-0.9.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[[bin]]
name = "handover-spike"
path = "src/main.rs"

[[bin]]
name = "handover-shim"
path = "src/bin/handover-shim.rs"

# The dedicated shim is measured from this profile.
[profile.shim]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
